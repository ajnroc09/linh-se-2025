<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="_layout"  >
<head>
    <meta charset="UTF-8">
    <title>Edit Company</title>
</head>
<body>
<div layout:fragment="content">
    <h2>UPDATE COMPANY</h2>
    <form method="post" action="/company/save" th:object="${employee}">
        <input type="hidden" th:field="*{id}"/>
        <p>
            <label>Company name:</label>
            <input class="form-control" type="text" th:field="*{name}"/>
        </p>
        <p class="form-group">
            <label>Company image:<br>
                <img th:src="*{image}" width="100" height="100"/>
                <input class="form-control" type="text" th:field="*{image}"/>
            </label>
        </p>
        <p class="form-group">
            <label>Company address:
                <input class="form-control" type="text" th:field="*{address}"/>
            </label>
        </p>
        <p>
            <button type="submit">UPDATE</button>
        </p>
    </form>
</div>
</body>
</html>
