<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="_layout"  >
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
</head>
<body>
<div layout:fragment="content">
    <h2>UPDATE EMPLOYEE</h2>
    <form method="post" action="/employee/save" th:object="${employee}">
        <input type="hidden" th:field="*{id}"/>

        <p>
            <label>Employee name:</label>
            <input class="form-control" type="text" th:field="*{name}"/>
        </p>
        <p>
        <label>Employee age:</label>
        <input class="form-control" type="number" th:field="*{age}"/>
        </p>
        <p class="form-group">
            <label>Employee image:<br>
                <img th:src="*{image}" width="100" height="100"/>
                <input class="form-control" type="text" th:field="*{image}"/>
            </label>
        </p>
        <p class="form-group">
            <label>Employee address:
                <input class="form-control" type="text" th:field="*{address}"/>
            </label>
        </p>

        <p class="form-group">
            <label>Gender:</label>
            <select class="form-select" th:field="*{gender}">
                <option value="2" th:selected="*{gender == 2}">Male</option>
                <option value="1" th:selected="*{gender == 1}">Female</option>
            </select>
        </p>
        <p class = "form-group">
            <label>Company: </label>
            <select class="form-select" th:field="*{company.id}">
                <option th:each="comp: ${companies}"
                        th:value="${comp.id}"
                        th:text="${comp.name}">
                </option>
            </select>

        </p>
        <p>
            <button type="submit">UPDATE</button>
        </p>
    </form>
</div>
</body>
</html>
